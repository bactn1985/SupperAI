<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#a30010">
<title>Tạo Avatar Kỷ niệm 81 năm Quốc khánh 02/09</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f6f8;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}iframe{border:0;width:100%;height:100%;display:block;background:#fff}#loading{position:fixed;inset:0;display:grid;place-items:center;background:#fff;color:#a30010;font-weight:800;font-size:16px;z-index:999;padding:24px;text-align:center}#loading.hide{display:none}
</style>
</head>
<body>
<div id="loading">Đang tải khung Avatar…</div>
<iframe id="app" src="./index.html" allow="web-share"></iframe>
<script>
(async()=>{
  const loading=document.getElementById('loading');
  const frame=document.getElementById('app');
  const [a,b]=await Promise.all([
    fetch('./assets/logo_part0.txt',{cache:'force-cache'}).then(r=>{if(!r.ok)throw new Error('logo0');return r.text()}),
    fetch('./assets/logo_part1.txt',{cache:'force-cache'}).then(r=>{if(!r.ok)throw new Error('logo1');return r.text()})
  ]);
  const logo=new Image();
  logo.src='data:image/webp;base64,'+(a.trim()+b.trim());
  await new Promise((resolve,reject)=>{logo.onload=resolve;logo.onerror=reject});

  function patch(){
    try{
      const w=frame.contentWindow,d=frame.contentDocument;
      if(!w||!d||typeof w.render!=='function') return setTimeout(patch,100);
      const canvas=d.getElementById('canvas');
      if(!canvas) return setTimeout(patch,100);
      if(w.__kamadoExactLogoPatched){loading.classList.add('hide');return;}

      const helper=d.getElementById('emptyTip');
      if(helper) helper.style.display='none';

      const original=w.render;
      w.render=function(){
        original();
        const c=canvas.getContext('2d');
        c.save();
        c.drawImage(logo,395,795,290,270);
        c.restore();
      };
      w.__kamadoExactLogoPatched=true;
      w.render();
      loading.classList.add('hide');
    }catch(e){setTimeout(patch,150)}
  }
  frame.addEventListener('load',patch);
  if(frame.contentDocument&&frame.contentDocument.readyState==='complete') patch();
})().catch(()=>{
  document.getElementById('loading').textContent='Không tải được khung Avatar. Vui lòng tải lại trang.';
});
</script>
</body>
</html>
